name = "personal-site"
compatibility_date = "2024-10-04"
pages_build_output_dir = "dist"

# 敏感变量（ADMIN_PASSWORD / SESSION_SECRET）请勿写在此处：
# 生产环境用 `wrangler pages secret put` 设置，本地开发用 `.dev.vars`。

[[d1_databases]]
binding = "DB"
database_name = "personal-site-db"
# 执行 `wrangler d1 create personal-site-db` 后，把返回的 id 填到这里
database_id = "36367455-7fd7-4d87-8705-92d051a5d174"
migrations_dir = "migrations"
